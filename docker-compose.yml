services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    ports:
    - target: 5432
      published: 57730
      protocol: tcp
      host_ip: 127.0.0.1
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U library -d library
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/library
      SPRING_DATASOURCE_USER: library
      SPRING_DATASOURCE_PASSWORD: library
    ports:
    - target: 8080
      published: 57731
      protocol: tcp
      host_ip: 127.0.0.1
volumes:
  pgdata: null
